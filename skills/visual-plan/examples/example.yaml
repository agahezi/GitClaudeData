# A visual plan: the content file. `node ../runtime/pack.mjs example.yaml` makes example.html.
title: Scheduling Sent Messages in PostBox
status:
  badge: open
  text: 2 decisions open
opening: 'PostBox sends a message the moment a person presses Send. This page is the design for <b>Send later</b>: the person picks a time, and PostBox sends the message at that time, also when the person is offline. It is new code beside the send path that exists. Click a box to zoom in.'
examplesNote: 'The page uses two people throughout: '
examples:
  - name: Example (Ann)
    text: schedules one message for 09:00 the next day
  - name: Example (Ben)
    text: has 50 scheduled messages and tries to add one more
retired:
  - deferred message
  - delayed send
blocks:
  - kind: problem
    problem: A person who writes at night wants the message to arrive in the morning. Today the only way is to keep the draft and remember. Support gets this request each week, and two competitors ship it. <b>Why now:</b> the composer is being redesigned this quarter, and the send path got its own worker last month, so the pieces to build on exist.
    today:
      label: How sending works today
      items:
        - The composer posts the message to <code>POST /messages</code> (<code>server/src/messages/routes.ts:41</code>), which calls the mail provider at once and stores the result.
        - The send worker (<code>server/src/mail/worker.ts:12</code>) retries a send that the provider refused, up to 3 times, from a retry table.
        - Drafts live in <code>drafts</code> (<code>server/src/drafts/store.ts:9</code>) and are never sent by the server.
        - The Sent folder reads <code>messages where status = 'sent'</code> (<code>server/src/folders/sent.ts:18</code>).
  - kind: map
    walkthrough: the composer saves the message with a send time instead of sending it. A worker wakes each minute, claims the messages whose time has come, sends each one through the provider that exists, and marks it sent or failed. The person sees the message in a Scheduled folder until it is sent.
    note: The provider and the Sent folder do not change. Everything new is in the three middle boxes.
    legend:
      - - code
        - plain code
      - - ext
        - outside service
      - - data
        - data in / out
    root: map
    nodes:
      map:
        title: Overview
        view:
          type: diagram
          viewBox: 0 0 1000 400
          label: 'Scheduled send: overview'
          boxes:
            - node: composer
              x: 20
              'y': 140
              w: 150
              h: 96
            - node: api
              x: 210
              'y': 140
              w: 150
              h: 96
